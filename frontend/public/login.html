<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン｜朝のニュースまとめ</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
      color: #1a1d23;
      font-family: 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif;
    }

    .card {
      width: min(100% - 48px, 360px);
      padding: 28px 24px;
      border: 1px solid #e1e4e9;
      border-radius: 14px;
      background: #fff;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 800;
    }

    .lead {
      margin: 0 0 20px;
      font-size: 13px;
      color: #5b6170;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 700;
    }

    input[type="password"] {
      width: 100%;
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid #c9ced6;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .error {
      display: none;
      margin: 0 0 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fdecea;
      color: #b42318;
      font-size: 13px;
    }

    .note {
      margin: 16px 0 0;
      font-size: 12px;
      color: #5b6170;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>朝のニュースまとめ</h1>
    <p class="lead">パスワードを入力してください</p>

    <p class="error" id="error">パスワードが違います。もう一度入力してください。</p>

    <form method="post" action="/login">
      <!-- ユーザー名は固定なので、入力させずに自動で送る -->
      <input type="hidden" name="username" value="owner">

      <label for="password">パスワード</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>

      <button type="submit">ログイン</button>
    </form>

    <p class="note">一度ログインすると、30日間はパスワードの入力が不要です。</p>
  </main>

  <script>
    // URLに ?error が付いていたら（パスワードが違ったら）エラー表示を出す
    if (new URLSearchParams(window.location.search).has('error')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
